<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#eef3f6">
<title>Game Hub controller</title>
<link rel="stylesheet" href="static/phone/phone.css">
</head>
<body>

<header id="top">
  <span id="badge" class="badge">P1</span>
  <span id="running">Game Hub</span>
  <span id="dot" class="dot" aria-label="connection"></span>
  <button id="btn-recentre" class="knob" title="Point at the middle, then tap">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><line x1="12" y1="1.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22.5" y2="12"/></svg>
  </button>
</header>

<div id="no-sensors" class="notice" hidden>
  This page cannot read the phone's motion sensors.<br>
  Reload over <b>https</b> and accept the certificate.
</div>
<div id="full" class="notice" hidden>
  Four phones are already playing. Someone has to put one down.
</div>

<main>
  <div id="dpad" class="dpad">
    <button data-name="up" aria-label="up"></button>
    <button data-name="left" aria-label="left"></button>
    <span class="hub"></span>
    <button data-name="right" aria-label="right"></button>
    <button data-name="down" aria-label="down"></button>
  </div>

  <button id="btn-a" class="a" data-name="a">A</button>
  <button id="btn-b" class="b" data-name="b">B</button>
</main>

<footer>
  <button class="knob wide" data-name="home">Home</button>
  <button class="knob wide" data-name="pause">Pause</button>
  <button id="btn-gear" class="knob" aria-label="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.4"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></svg>
  </button>
</footer>

<dialog id="settings">
  <h2>Settings</h2>

  <label class="row">Name
    <input id="name" type="text" maxlength="12" placeholder="P1"
           autocomplete="off" autocapitalize="words" spellcheck="false">
  </label>

  <label class="row">Sensitivity
    <input id="sensitivity" type="range" min="0.5" max="2.5" step="0.1" value="1">
  </label>

  <div class="cal">
    <div class="row">Flick <input id="flick" type="range" min="1" max="7" step="0.1" value="3.4"></div>
    <div class="meter"><i id="meterbar"></i><b id="meterline"></b></div>
    <div class="row">
      <button id="btn-cal" class="knob wide">Calibrate</button>
      <span id="calsay" class="say">Snap the phone left and right five times.</span>
    </div>
  </div>

  <div class="row">
    <button id="btn-record" class="knob wide">Record</button>
    <button id="btn-close" class="knob wide primary">Done</button>
  </div>
</dialog>

<script src="static/shared/controls.js"></script>
<script src="static/phone/phone.js"></script>
</body>
</html>
